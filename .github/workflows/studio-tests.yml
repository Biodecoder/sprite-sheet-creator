name: Offline asset studio tests
on:
  push:
    branches: [feature/offline-video-asset-studio]
  pull_request:
    paths:
      - "app/studio/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/studio-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:studio
      - run: npx tsc --noEmit
      - run: npm run build
